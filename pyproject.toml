[project]
name = "slack-support-assistant"
version = "0.1.0"
description = "A standalone Slack support assistant reconstructed from Thanos contributions."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "faiss-cpu>=1.14,<2",
    "google-api-python-client>=2.166,<3",
    "google-auth>=2.38,<3",
    "numpy>=2.0,<3",
    "openpyxl>=3.1,<4",
    "requests>=2.31,<3",
    "slack-sdk>=3.27,<4",
    "slack-bolt>=1.26,<2",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
extend-select = ["I"]
